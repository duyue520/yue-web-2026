# 由 05-certbot-dns01.sh 生成
# nginx.conf 里 80 端口的默认 server（server_name _）保持不变，
# 所以用 IP 直接访问的行为完全不受影响。

server {
    listen       80;
    listen       [::]:80;
    server_name  heyiwei.tech www.heyiwei.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        allow all;
    }
    location / {
        return 301 https://$wb_canonical_host$request_uri;
    }
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  heyiwei.tech www.heyiwei.tech;
    root         /var/www/site;

    ssl_certificate     /etc/nginx/ssl/heyiwei.tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/heyiwei.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache   shared:wb_ssl:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers on;

    # ---- URL 参数攻击特征（SQLi/XSS/路径穿越/命令执行）→ 静默断连 ----
    if ($args ~* "(?:union(?:%20|\+|%2b)+select|<script|%3cscript|javascript%3a|onerror%3d|onload%3d|\./\.\./|%2e%2e%2f|etc%2fpasswd|sleep%28|benchmark%28|base64_decode%28|wp-json/wp/v2/users)") {
        return 444;
    }

    # ---- 攻击/限流响应：给攻击者明确的警告（heyiwei.tech WAF） ----
    error_page 403 = @wb_403;
    error_page 429 = @wb_429;

    location @wb_403 {
        default_type application/json;
        add_header X-WB-Blocked "1" always;
        add_header Cache-Control "no-store" always;
        return 403 '{"code":"BLOCKED","message":"⚠️ 你的访问行为已被 heyiwei.tech 安全系统记录并拦截，继续攻击将导致 IP 永久封禁。如为误判请联系站长。"}';
    }
    location @wb_429 {
        default_type application/json;
        add_header X-WB-Blocked "1" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"RATE_LIMITED","message":"⚠️ 请求过于频繁已被限流（heyiwei.tech 防护系统），你的 IP 与行为特征均已记录。"}';
    }

    include /etc/nginx/default.d/site.conf;

    include /etc/nginx/snippets/wb-api-proxy.conf;

    # HSTS 等备案通过、站点稳定运行几天后再开（开了就退不回 http）
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
