# 单 IP 请求速率与并发上限 —— 防爬虫/恶意抓取刷爆按流量计费的带宽
limit_req_zone  $binary_remote_addr zone=wb_perip:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=wb_conn:10m;

# 接口专用：AI 推理很吃 CPU，单 IP 必须更严
limit_req_zone  $binary_remote_addr zone=wb_api:10m      rate=5r/s;
limit_conn_zone $binary_remote_addr zone=wb_apiconn:10m;
limit_req_zone  $binary_remote_addr zone=wb_auth:10m  rate=1r/s;

# AI 网关 /v1/（OpenAI 兼容，SSE 流式）：限请求频率，不限单次时长
limit_req_zone  $binary_remote_addr zone=wb_ai:10m  rate=5r/s;
