# 由 07-harden-nginx.sh + 12-nginx-api.sh 生成 —— 必须放在 http 上下文（conf.d 正好是）

# ============================================================
#  方法白名单
#  ------------------------------------------------------------
#  静态站是纯只读的，GET/HEAD 就够；
#  /api/ 是 REST 接口，前端还要用 PUT（改资料 / 改密码）
#  和 DELETE（删留言 / 删诊断记录 / 删文章 / 删评论）。
#  所以必须分两张表，不能合并——合并会让静态路径上的
#  PUT/DELETE 也一起被放行。
# ============================================================

map $request_method $wb_ok_static {
    default   0;
    GET       1;
    HEAD      1;
    POST      1;
}

map $request_method $wb_ok_api {
    default   0;
    GET       1;
    HEAD      1;
    POST      1;
    PUT       1;
    DELETE    1;
    OPTIONS   1;
}

map $request_uri $wb_is_api {
    default   0;
    ~^/api/   1;
}

# 静态通道：只认「非 /api/ + 静态安全方法」
map "$wb_is_api:$wb_ok_static" $wb_pass_static {
    default   0;
    "0:1"     1;
}

# 接口通道：只认「/api/ + 接口安全方法」
map "$wb_is_api:$wb_ok_api" $wb_pass_api {
    default   0;
    "1:1"     1;
}

# 两条通道任一放行即可；都不是就 1 = 444 断连
map "$wb_pass_static$wb_pass_api" $wb_bad_method {
    default   1;
    "10"      0;
    "01"      0;
}

# 空 User-Agent 与常见扫描/利用工具的特征串
map $http_user_agent $wb_bad_ua {
    default  0;
    ""       1;
    ~*(?:masscan|nmap|nikto|sqlmap|acunetix|nessus|openvas|zgrab|gobuster|dirbuster|wpscan|nuclei|xray|hydra|fuzz)  1;
}
