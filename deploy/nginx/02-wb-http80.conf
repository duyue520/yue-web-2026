# 由 12c-wb-http80.sh 生成
#
# 一、Host 白名单 map
#   10-https.conf 的 80 跳转如果直接用 $host 拼目标，
#   伪造 Host 头就能造成开放重定向（钓鱼常用手法）。
#   这里只认本站的两个域名，其余一律归一到主域名。
map $host $wb_canonical_host {
    default            heyiwei.tech;
    heyiwei.tech       heyiwei.tech;
    "www.heyiwei.tech" www.heyiwei.tech;
}

# 二、80 端口 default_server
#   nginx.conf 里的 `server { listen 80; server_name _; }` 位于 include conf.d 之后，
#   不是真正的默认 server。这里显式声明，把"用 IP 直接访问"的请求接回来，
#   让它照旧返回静态站点，而不是 301 到 https://<IP>（IP 没证书，必报错）。
server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _wb_default_;
    root         /var/www/site;

    include /etc/nginx/default.d/site.conf;
}
