<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>汴河图卷 · 宋代水市生成器</title>
<style>
  :root{
    --ink:#2b2724; --ink2:#5b534b; --paper:#efe9dc; --line:rgba(43,39,36,.18);
    --seal:#a8362b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 70% 10%, #f6f2e8 0%, #e6dfd0 60%, #dcd4c2 100%);
  }
  #app{position:absolute;inset:0}
  #app canvas{display:block}

  .panel{
    position:absolute; top:20px; right:20px; z-index:10;
    width:212px; padding:16px 16px 14px;
    background:rgba(247,243,234,.86);
    border:1px solid var(--line);
    border-radius:2px;
    backdrop-filter:blur(6px);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 8px 26px rgba(60,50,40,.10);
  }
  .panel h1{
    font-size:19px; font-weight:500; letter-spacing:.28em; margin-bottom:2px;
  }
  .panel .sub{font-size:11px;color:var(--ink2);letter-spacing:.14em;margin-bottom:14px}
  .rule{height:1px;background:var(--line);margin:12px 0}

  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink2);padding:3px 0}
  .row b{font-weight:500;color:var(--ink);letter-spacing:.04em}

  button{
    font-family:inherit;cursor:pointer;
    background:rgba(255,255,255,.5);
    border:1px solid rgba(43,39,36,.28);
    border-radius:1px;
    color:var(--ink);
    padding:8px 10px;font-size:13px;letter-spacing:.2em;
    transition:background .18s,border-color .18s,transform .06s;
  }
  button:hover{background:rgba(255,255,255,.9);border-color:rgba(43,39,36,.5)}
  button:active{transform:translateY(1px)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  #btn-gen{
    border-color:var(--seal);color:var(--seal);
    background:rgba(168,54,43,.06);
  }
  #btn-gen:hover{background:rgba(168,54,43,.12)}

  .hint{
    position:absolute;left:20px;bottom:18px;z-index:10;
    font-size:11.5px;color:var(--ink2);letter-spacing:.1em;line-height:1.9;
    opacity:.75;
  }
  .seal{
    position:absolute;left:20px;top:20px;z-index:10;
    width:46px;height:46px;border:1.6px solid var(--seal);border-radius:2px;
    color:var(--seal);display:grid;place-items:center;
    font-size:15px;letter-spacing:0;line-height:1.05;text-align:center;
    background:rgba(168,54,43,.05);
    transform:rotate(-3deg);
    user-select:none;
  }

  #loader{
    position:absolute;inset:0;z-index:50;display:grid;place-items:center;
    background:radial-gradient(900px 600px at 50% 40%,#f4efe4,#e2daca);
    transition:opacity .5s ease;
  }
  #loader.gone{opacity:0;pointer-events:none}
  #loader .t{font-size:15px;letter-spacing:.5em;color:var(--ink2)}
</style>
</head>
<body>
  <div id="app"></div>

  <div class="seal">汴河<br>图卷</div>

  <div class="panel">
    <h1>汴河图卷</h1>
    <div class="sub">GENRE PAINTING OF THE SONG</div>
    <div class="rule"></div>
    <div class="row"><span>卷次</span><b id="hud-seed">—</b></div>
    <div class="row"><span>营造</span><b id="hud-info">—</b></div>
    <div class="rule"></div>
    <div class="btns">
      <button id="btn-gen">重绘</button>
      <button id="btn-roll">易图</button>
    </div>
  </div>

  <div class="hint">左键旋转 · 右键平移 · 滚轮远近</div>
  <div id="loader"><div class="t">研 墨 中</div></div>
