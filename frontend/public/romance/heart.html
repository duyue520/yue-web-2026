<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>爱心 💖</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a0011;
        }
        canvas {
            display: block;
        }
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: clamp(24px, 6vw, 72px);
            font-weight: bold;
            font-family: 'Georgia', serif;
            pointer-events: none;
            text-shadow: 0 0 40px rgba(255, 50, 100, 0.3);
            animation: fadeIn 3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="text-overlay">❤</div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 粒子类
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                // 爱心参数方程
                const t = Math.random() * Math.PI * 2;
                const s = Math.min(W, H) * 0.003;
                const hx = s * 16 * Math.pow(Math.sin(t), 3);
                const hy = -s * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                this.targetX = W / 2 + hx;
                this.targetY = H / 2 + hy;
                
                // 随机起始位置
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                
                this.size = 2 + Math.random() * 3;
                
                // 颜色渐变 - 从粉到红
                const hue = 330 + Math.random() * 30;
                this.color = `hsla(${hue}, 100%, ${60 + Math.random() * 30}%, 1)`;
                this.baseAlpha = 0.6 + Math.random() * 0.4;
                
                this.speed = 0.02 + Math.random() * 0.03;
                this.progress = 0;
                this.delay = Math.random() * 100;
                this.finished = false;
            }

            update() {
                if (this.finished) return;
                this.progress += this.speed;
                
                if (this.progress >= 1) {
                    this.progress = 1;
                    this.finished = true;
                }
                
                // 缓动函数
                const ease = 1 - Math.pow(1 - this.progress, 3);
                
                this.x += (this.targetX - this.x) * this.speed * 2;
                this.y += (this.targetY - this.y) * this.speed * 2;
            }

            draw() {
                if (this.progress <= 0) return;
                const alpha = this.baseAlpha * Math.min(1, this.progress * 3);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace('1)', `${alpha})`);
                ctx.fill();
                
                // 发光效果
                if (this.finished) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color.replace('1)', `${alpha * 0.1})`);
                    ctx.fill();
                }
            }
        }

        // 浮动心形（背景）
        class FloatingHeart {
            constructor() {
                this.reset();
            }
            reset() {
                const t = Math.random() * Math.PI * 2;
                const s = Math.min(W, H) * 0.002;
                this.x = W / 2 + s * 16 * Math.pow(Math.sin(t), 3);
                this.y = H / 2 - s * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                this.ox = this.x;
                this.oy = this.y;
                this.size = 1 + Math.random() * 2;
                this.alpha = 0.1 + Math.random() * 0.2;
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.001 + Math.random() * 0.002;
            }
            draw(time) {
                const pulse = 1 + Math.sin(time * 0.001 + this.phase) * 0.1;
                const x = this.ox + (this.ox - W/2) * (pulse - 1) * 0.5;
                const y = this.oy + (this.oy - H/2) * (pulse - 1) * 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, this.size * pulse, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 100, 150, ${this.alpha})`;
                ctx.fill();
            }
        }

        // 创建粒子
        const particleCount = Math.min(800, Math.floor(W * H / 2000));
        const particles = Array.from({ length: particleCount }, () => new Particle());
        
        // 创建背景心形
        const bgHearts = Array.from({ length: 60 }, () => new FloatingHeart());

        // 烟花粒子（点击效果）
        class Firework {
            constructor(x, y) {
                const total = 30 + Math.random() * 30;
                this.particles = [];
                const colors = ['#ff6b9d', '#c44dff', '#ff4081', '#ff8a80', '#ea80fc', '#ff80ab'];
                for (let i = 0; i < total; i++) {
                    const angle = (i / total) * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 2 + Math.random() * 3,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        life: 1,
                        decay: 0.01 + Math.random() * 0.02
                    });
                }
                this.alive = true;
            }
            update() {
                if (!this.alive) return;
                let allDead = true;
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.life -= p.decay;
                    if (p.life > 0) allDead = false;
                });
                if (allDead) this.alive = false;
            }
            draw() {
                if (!this.alive) return;
                this.particles.forEach(p => {
                    if (p.life <= 0) return;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fillStyle = p.color.replace(')', `,${p.life})`) || 
                        `rgba(255, 100, 150, ${p.life})`;
                    ctx.fill();
                });
            }
        }

        let fireworks = [];
        let time = 0;

        // 点击产生烟花
        canvas.addEventListener('click', (e) => {
            fireworks.push(new Firework(e.clientX, e.clientY));
        });

        // 触摸也支持
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            fireworks.push(new Firework(touch.clientX, touch.clientY));
        });

        function draw() {
            time++;
            ctx.fillStyle = 'rgba(26, 0, 17, 0.3)';
            ctx.fillRect(0, 0, W, H);

            // 背景心形
            bgHearts.forEach(h => h.draw(time));

            // 主粒子
            particles.forEach(p => {
                if (!p.finished) p.update();
                p.draw();
            });

            // 重新播放（循环）
            if (particles.every(p => p.finished)) {
                particles.forEach(p => {
                    p.finished = false;
                    p.progress = 0;
                    p.x = Math.random() * W;
                    p.y = Math.random() * H;
                    const t = Math.random() * Math.PI * 2;
                    const s = Math.min(W, H) * 0.003;
                    p.targetX = W / 2 + s * 16 * Math.pow(Math.sin(t), 3);
                    p.targetY = H / 2 - s * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                });
            }

            // 烟花
            fireworks = fireworks.filter(f => f.alive);
            fireworks.forEach(f => {
                f.update();
                f.draw();
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
